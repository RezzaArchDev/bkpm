<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 320px; margin: 80px auto; padding: 0 16px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form id="form-login">
        <p><label>Username<br><input id="username" required></label></p>
        <p><label>Password<br><input id="password" type="password" required></label></p>
        <button type="submit">Login</button>
    </form>
    <script src="login.js"></script>
</body>
</html>
