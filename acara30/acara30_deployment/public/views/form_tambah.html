<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tambah Mahasiswa</h1>
    <form id="form-tambah" novalidate>
        <p><label>NIM<br><input id="nim" placeholder="9 digit angka"></label></p>
        <p><label>Nama<br><input id="nama"></label></p>
        <p><label>Program studi<br><input id="prodi"></label></p>
        <p><label>Foto (JPG/PNG, maksimal 2MB)<br><input id="foto" type="file" accept="image/png, image/jpeg"></label></p>
        <button type="submit">Simpan</button>
        <a href="dashboard.html">Kembali</a>
    </form>

    <script src="common.js"></script>
    <script src="form_tambah.js"></script>
</body>
</html>
